<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AcFella{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">
                <span class="logo">🎛️</span>
                <span class="brand-name">AcFella</span>
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a></li>
            <li><a href="/projects" class="{% if '/project' in request.path %}active{% endif %}">Projects</a></li>
            <li><a href="/room-modes" class="{% if request.path == '/room-modes' %}active{% endif %}">Room Modes 3D</a></li>
            <li><a href="/speaker-placement" class="{% if request.path == '/speaker-placement' %}active{% endif %}">Speaker Placement</a></li>
            <li><a href="/porous-absorber" class="{% if request.path == '/porous-absorber' %}active{% endif %}">Absorber Calc</a></li>
        </ul>
        <div class="nav-mobile-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</div>
    </nav>
    {% block content %}{% endblock %}
    <footer class="footer">
        <div class="container">
            <p>AcFella — Professional Acoustic Consulting Platform</p>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
